<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Praneeth Kilaparthi">
    <meta name="theme-color" content="#111111">
    <title>Thank You — Praneeth Kilaparthi</title> 
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="scss/index.scss">
    
    <style>
      ::selection {
        background-color: #ffffff;
        color: #000000;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #111111;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }
      .thanks-container {
        text-align: center;
        z-index: 10;
        padding: 2rem;
      }
      .thanks-title {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 5rem;
        margin-bottom: 1rem;
        line-height: 1;
        letter-spacing: 2px;
      }
      .thanks-desc {
        font-size: 1.2rem;
        opacity: 0.8;
        max-width: 500px;
        margin: 0 auto 3rem auto;
        line-height: 1.6;
      }
      .back-btn {
        display: inline-block;
        padding: 15px 30px;
        border-radius: 30px;
        border: 1px solid rgba(255,255,255,0.4);
        background: transparent;
        color: white;
        text-decoration: none;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.3s ease;
      }
      .back-btn:hover {
        background: white;
        color: black;
      }
    </style>
</head>
<body>
    <!-- Film grain overlay -->
    <div class="c-grain" aria-hidden="true"></div>
    
    <!-- AMBIENT GRADIENT GLOW -->
    <div style="position: absolute; top: -20%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(120,0,255,0.15) 0%, rgba(0,0,0,0) 70%); border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; animation: pulseGlow 10s infinite alternate;"></div>
    <div style="position: absolute; bottom: -10%; right: -10%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(255,100,0,0.1) 0%, rgba(0,0,0,0) 70%); border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; animation: pulseGlow 8s infinite alternate-reverse;"></div>
    
    <div class="thanks-container">
        <h1 class="thanks-title">MESSAGE RECEIVED</h1>
        <p class="thanks-desc">Thank you for reaching out! I've received your message and will get back to you as soon as possible.</p>
        <a href="/" class="back-btn">RETURN HOME</a>
    </div>
    
    <style>
      @keyframes pulseGlow {
        0% { transform: scale(1) translate(0, 0); opacity: 0.8; }
        100% { transform: scale(1.2) translate(50px, 50px); opacity: 1; }
      }
    </style>
</body>
</html>
