<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Praneeth Kilaparthi">
    <meta name="theme-color" content="#111111">
    <title>Message Received — Praneeth Kilaparthi</title> 
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="scss/index.scss">
    
    <style>
      body, a, button {
        cursor: auto !important;
      }
      a, button, .back-btn {
        cursor: pointer !important;
      }
      ::selection {
        background-color: #ffffff;
        color: #000000;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #0a0a0a;
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }
      
      /* Ambient Backgrounds */
      .ambient-glow-1, .ambient-glow-2 {
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
        pointer-events: none;
        z-index: 0;
      }
      .ambient-glow-1 {
        top: -10%; left: 0%;
        width: 45vw; height: 45vw;
        background: radial-gradient(circle, rgba(120,0,255,0.12) 0%, rgba(0,0,0,0) 70%);
        animation: pulseGlow 12s infinite alternate ease-in-out;
      }
      .ambient-glow-2 {
        bottom: -10%; right: 0%;
        width: 40vw; height: 40vw;
        background: radial-gradient(circle, rgba(255,100,0,0.08) 0%, rgba(0,0,0,0) 70%);
        animation: pulseGlow 10s infinite alternate-reverse ease-in-out;
      }

      /* Glassmorphism Card */
      .thanks-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 4rem;
        border-radius: 24px;
        text-align: center;
        z-index: 10;
        max-width: 500px;
        width: 90%;
        box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
        transform: translateY(30px);
        opacity: 0;
        animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Animated Checkmark */
      .success-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 2rem auto;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0));
        border: 1px solid rgba(255,255,255,0.2);
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }
      .success-icon svg {
        width: 40px;
        height: 40px;
        color: #fff;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: drawCheck 0.6s 0.3s cubic-bezier(0.65, 0, 0.45, 1) forwards;
      }

      .thanks-title {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 4.5rem;
        margin: 0 0 1rem 0;
        line-height: 1;
        letter-spacing: 2px;
        background: linear-gradient(180deg, #FFFFFF 0%, rgba(255,255,255,0.5) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .thanks-desc {
        font-size: 1.1rem;
        color: rgba(255, 255, 255, 0.7);
        margin: 0 auto 2.5rem auto;
        line-height: 1.6;
        font-weight: 300;
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 16px 36px;
        border-radius: 30px;
        border: 1px solid rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.05);
        color: white;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        overflow: hidden;
      }
      
      .back-btn::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: white;
        transform: scaleX(0);
        transform-origin: right;
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: -1;
      }

      .back-btn:hover {
        color: black;
        border-color: white;
      }
      .back-btn:hover::before {
        transform: scaleX(1);
        transform-origin: left;
      }
      
      .back-btn svg {
        transition: transform 0.3s ease;
      }
      .back-btn:hover svg {
        transform: translateX(-4px);
      }

      /* Animations */
      @keyframes pulseGlow {
        0% { transform: scale(1) translate(0, 0); opacity: 0.7; }
        100% { transform: scale(1.1) translate(30px, 30px); opacity: 1; }
      }
      @keyframes slideUpFade {
        0% { opacity: 0; transform: translateY(40px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes drawCheck {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
    </style>
</head>
<body>
    <!-- Film grain overlay -->
    <div class="c-grain" aria-hidden="true"></div>
    
    <!-- Ambient Background -->
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>
    
    <div class="thanks-card">
        <div class="success-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <h1 class="thanks-title">TRANSMISSION<br>SUCCESSFUL</h1>
        <p class="thanks-desc">Thank you for reaching out. Your message has securely landed in my inbox. I will review it and respond shortly.</p>
        <a href="/" class="back-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            RETURN TO BASE
        </a>
    </div>
</body>
</html>
